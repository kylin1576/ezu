services:
  mysql:
    image: mysql:8.0
    container_name: ezu-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ezu123456
      MYSQL_DATABASE: ezu
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - ezu-mysql-data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci

  redis:
    image: redis:7-alpine
    container_name: ezu-redis
    ports:
      - "6379:6379"
    volumes:
      - ezu-redis-data:/data

  # app（后端镜像就绪后启用）
